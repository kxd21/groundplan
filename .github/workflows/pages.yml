# Deploy the download landing page to GitHub Pages.
#
# Enable Pages in the repo settings: Source = GitHub Actions.
# The live URL is https://<owner>.github.io/groundplan/download/

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/download/**'
      - 'docs/installation.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p _site/download
          cp -R docs/download/. _site/download/
          cp docs/installation.md _site/installation.md
          # Root redirects to the download page so /groundplan/ is useful.
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8" />
          <title>Groundplan</title>
          <meta http-equiv="refresh" content="0; url=download/" />
          <link rel="canonical" href="download/" />
          <p><a href="download/">Download Groundplan</a></p>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
