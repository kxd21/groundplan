name: Build

# Build on each target OS so packaging and launch behavior are exercised in the
# same environment customers use. Version tags also publish a GitHub Release
# with the installers attached — that is the public download surface.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, hermetic tests, and build
        run: npm run check
      - name: Release dependency audit
        run: npm run audit:release

  package:
    needs: check
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: groundplan-macos
          - os: windows-latest
            script: dist:win
            artifact: groundplan-windows
          - os: ubuntu-latest
            script: dist:linux
            artifact: groundplan-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cross-platform domain tests
        run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          # Skip signing/notarisation; unsigned builds are fine for internal use.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Inspect and launch packaged application
        run: npm run smoke:packaged -- release --launch
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Collect installers
        id: assets
        run: |
          set -euo pipefail
          mkdir -p publish
          find dist-release -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' -o -name '*.AppImage' \) -print0 |
            while IFS= read -r -d '' f; do
              cp -v "$f" publish/
            done
          ls -la publish
          count=$(find publish -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No installers found to publish" >&2
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NOTES_FILE=$(mktemp)
          sed "s/__VERSION__/${VERSION}/g" docs/release-notes.md > "$NOTES_FILE"

          gh release create "$TAG" \
            --title "Groundplan ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            publish/*
